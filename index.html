<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Great Creation Studios</title>
<style>
:root{
--ground:#010207;
--panel:#111111;
--ink:#f0eef5;
--copper:#b87333;
--copper-hover:#d4944a;
--copper-pressed:#a06228;
--orange:#ffbf00;
--cyan:#00b4d8;
--pink:#ffb0c0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ground)}
body{
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
-webkit-user-select:none;user-select:none;
-webkit-tap-highlight-color:transparent;
overscroll-behavior:none;
touch-action:manipulation;
}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.halo{
position:absolute;width:66vmin;height:66vmin;border-radius:50%;
background:conic-gradient(from 0deg,var(--orange),var(--copper),var(--pink),var(--cyan),var(--orange));
filter:blur(9vmin);opacity:.16;pointer-events:none;
animation:spin 26s linear infinite;
}
.disc{
position:absolute;width:98vmin;height:98vmin;border-radius:50%;pointer-events:none;
background:radial-gradient(circle at 50% 42%,rgba(23,25,31,.86) 0%,rgba(17,17,17,.84) 58%,rgba(11,13,20,.87) 100%);
border:1px solid rgba(184,115,51,.55);
box-shadow:0 0 12vmin rgba(184,115,51,.22),inset 0 0 8vmin rgba(0,0,0,.55);
transform:scale(0);opacity:0;
transition:transform .72s cubic-bezier(.22,1.45,.36,1),opacity .4s ease;
}
.stage.open .disc{transform:scale(1);opacity:1}
.shock{
position:absolute;width:98vmin;height:98vmin;border-radius:50%;pointer-events:none;
border:2px solid rgba(212,148,74,.8);opacity:0;transform:scale(.2);
}
.stage.open .shock{animation:shock .9s cubic-bezier(.16,.84,.44,1) .06s}
.orb{
position:absolute;width:19vmin;height:19vmin;border-radius:50%;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;
background:#16181d;
border:1px solid rgba(240,238,245,.14);
color:var(--ink);text-decoration:none;
font-size:clamp(8px,2vmin,13px);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
transform:scale(0);opacity:0;pointer-events:none;
transition:transform .58s cubic-bezier(.34,1.56,.64,1) 0s,opacity .3s ease 0s,background .2s,border-color .2s,box-shadow .2s;
}
.orb i{display:block;width:34%;height:2px;border-radius:2px;background:var(--accent)}
.stage.open .orb{pointer-events:auto}
.stage.open .o-top{--tx:0vmin;--ty:-32vmin;transition-delay:.18s,.18s,0s,0s,0s}
.stage.open .o-right{--tx:32vmin;--ty:0vmin;transition-delay:.26s,.26s,0s,0s,0s}
.stage.open .o-bottom{--tx:0vmin;--ty:32vmin;transition-delay:.34s,.34s,0s,0s,0s}
.stage.open .o-left{--tx:-32vmin;--ty:0vmin;transition-delay:.42s,.42s,0s,0s,0s}
.stage.open .orb{transform:translate(var(--tx),var(--ty)) scale(1);opacity:1}
.stage.open .orb:hover{
transform:translate(var(--tx),var(--ty)) scale(1.07);
background:#1c1f26;border-color:var(--copper-hover);
box-shadow:0 0 4.5vmin rgba(212,148,74,.35);
}
.stage.open .orb:active{
transform:translate(var(--tx),var(--ty)) scale(.96);
border-color:var(--copper-pressed);
}
.orb:focus-visible{outline:2px solid var(--copper);outline-offset:4px}
.o-top{--accent:var(--copper)}
.o-right{--accent:var(--cyan)}
.o-bottom{--accent:var(--pink)}
.o-left{--accent:var(--orange)}
.mark{
position:relative;z-index:2;width:30vmin;height:30vmin;border-radius:50%;
background:transparent;border:none;cursor:pointer;padding:0;display:grid;place-items:center;
animation:breathe 4.5s ease-in-out infinite;
}
.mark img{
width:100%;height:100%;object-fit:contain;pointer-events:none;
filter:drop-shadow(0 0 3vmin rgba(0,0,0,.6));
transition:transform .18s cubic-bezier(.34,1.56,.64,1);
-webkit-user-drag:none;
}
.mark:active img{transform:scale(.94)}
.mark:focus-visible{outline:2px solid var(--copper);outline-offset:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes shock{0%{transform:scale(.18);opacity:.9}100%{transform:scale(1.12);opacity:0}}
@media (prefers-reduced-motion:reduce){
.halo,.mark,.stage.open .shock{animation:none}
.disc,.orb,.mark img{transition:none}
}
</style>
</head>
<body>
<main class="stage">
<div class="halo"></div>
<div class="disc"></div>
<div class="shock"></div>
<a class="orb o-top" href="https://greatcreationstudios.greatcreations.art/" tabindex="-1"><span>Studios</span><i></i></a>
<a class="orb o-right" href="applications.html" tabindex="-1"><span>Apps</span><i></i></a>
<a class="orb o-bottom" href="https://greatcreations.ca/" tabindex="-1"><span>GC.ca</span><i></i></a>
<a class="orb o-left" href="https://greatcreations.art/portfolio/" tabindex="-1"><span>Portfolio</span><i></i></a>
<button class="mark" aria-expanded="false" aria-label="Open menu"><img src="gcs-mark.png" alt="Great Creation Studios" draggable="false"></button>
</main>
<script>
const stage=document.querySelector('.stage'),mark=document.querySelector('.mark'),orbs=document.querySelectorAll('.orb');
// Tap sound: the Observatory's planet (service node) click sound, playNodeSound in
// greatcreationstudios.greatcreations.art/observatory.html. One AudioContext, made on the first tap.
let audio;
const tapSound=()=>{try{
audio=audio||new (window.AudioContext||window.webkitAudioContext)();
if(audio.state==='suspended')audio.resume();
const now=audio.currentTime;
const voice=(type,start,stop,shape)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=type;shape(o.frequency,g.gain);o.connect(g);g.connect(audio.destination);o.start(now+start);o.stop(now+stop)};
// Quick descending blip
voice('sine',0,.1,(f,g)=>{f.setValueAtTime(1600,now);f.exponentialRampToValueAtTime(800,now+.06);g.setValueAtTime(.15,now);g.exponentialRampToValueAtTime(.001,now+.08)});
// Confirming tone, steady pitch
voice('sine',.08,.32,(f,g)=>{f.value=1046;g.setValueAtTime(0,now+.08);g.linearRampToValueAtTime(.1,now+.1);g.setValueAtTime(.1,now+.22);g.exponentialRampToValueAtTime(.001,now+.3)});
}catch(e){}};
mark.addEventListener('click',()=>{
tapSound();
const open=stage.classList.toggle('open');
mark.setAttribute('aria-expanded',open);
mark.setAttribute('aria-label',open?'Close menu':'Open menu');
orbs.forEach(o=>o.tabIndex=open?0:-1);
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('open'))mark.click()});
addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
