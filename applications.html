<script>
/* ======================================================================
   SPOTS — what shows through the dashed outlines.                 EDIT HERE
   ----------------------------------------------------------------------
   Every page (000 to 999) is made of components. Hover a component (or
   press and hold it on a touch screen) and a dashed outline opens. Each
   of those outlines is a spot that can hold one creation. A spot left
   out of this list stays exactly as it is: the outline alone.

   To fill a spot, copy the template below, paste it between the square
   brackets, remove the two slashes at the start of each line, fill it in.
   Put a comma between entries. The search in the rail is built from
   this list by itself.

   //  {
   //    page: 12,                     // 0 to 999, the number in the rail
   //    component: "dial",            // which component on that page, see below
   //    title: "Name of the creation",
   //    tags: ["sound", "2026"],      // optional, used by the tag filter
   //    window: {
   //      kind: "site",               // optional, guessed from src if left out:
   //                                  //  "site"  a web page (shown in a sealed frame)
   //                                  //  "video" .mp4 .webm .mov, or a YouTube / Vimeo link
   //                                  //  "image" .png .jpg .gif .webp .avif .svg …
   //                                  //  "pdf"   a .pdf (first page; phones show the poster)
   //                                  //  "audio" .mp3 .wav .ogg .m4a … (plays only with sound on)
   //                                  //  "html"  a snippet of HTML, written straight into src
   //                                  //          (write <\/script> for a closing script tag)
   //      src: "https://…",           // the page, file or link to show
   //      poster: "https://….jpg",    // optional still, shown while loading or if it fails
   //      fit: "cover"                // optional, "cover" (fill) or "contain" (whole)
   //    },
   //    link: "https://…"             // optional, where the creation lives
   //  },

   WHICH COMPONENT IS WHICH (the name to put in `component`):
     "wordmark"  the big GREAT CREATION STUDIOS band
     "dial"      the round dial with tick marks and a degree number (000°)
     "slider"    the long bar with a six-sided thumb and a +0.00 number
     "toggles"   the bank of four switches
     "menu"      the list of page numbers with tiny layout pictures
     "trace"     the dark slab with moving lines, like a scope
     "field"     the four-digit number you can type into (4172)
     "readout"   a big page number with small live figures under it
     "panel"     a plain solid slab with a ruler and its size (0312×0188);
                 "panel 2" is the second one on pages that have two
     "hold"      the six-sided button with the pause / play mark
     "rebuild"   the six-sided button with two arrows
   The first seven (wordmark to field) are on every page at every screen
   size, so a spot on them shows on desktops, tablets and phones alike.
   readout, panel, hold and rebuild sit on some pages only; a spot on one
   still lists in the search, but only opens on pages and screens that
   have it. On phones, components not in view are folded into the thin
   spines along the bottom: tap a spine to unfold it, then press and hold.
   A filled spot's component shows the title where it showed a number.
   ====================================================================== */

:root{
  --ink:#0b0d14;--paper:#fafaf7;--ink2:#1b2030;--ink3:#262c3f;
  --bg:var(--ink);--fg:var(--paper);--dim:#9aa0b4;
  --mono:"Martian",ui-monospace,monospace;--disp:"Anybody",system-ui,sans-serif;
  --notch:14px;--focus:#ffa8d0;
}
html.light{--bg:#fafaf7;--fg:#0b0d14;--ink2:#0b0d14;--ink3:#2a2f40;--dim:#4a5064}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{font-family:var(--disp);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;transition:background-color .5s cubic-bezier(.2,.7,.2,1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* skip link: drawn as a kit slab */
.skip{position:fixed;left:16px;top:-80px;z-index:50;font:600 13px/1 var(--mono);padding:14px 22px 14px 26px;background:var(--paper);color:var(--ink);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-decoration:none}
.skip:focus{top:16px;outline:none}

#stage{position:fixed;inset:0;overflow:hidden;transform-origin:0 0;outline:none}
#stage.lifting{cursor:grabbing}

/* piece = carrier (positioned, may carry the hard lift shadow) + slab (clipped) */
.pc{position:absolute;left:0;top:0;will-change:transform;contain:layout style;transform-origin:50% 50%}
.pc.lift{filter:drop-shadow(10px 12px 0 var(--shadow,#000))}
.sl{position:absolute;inset:0;overflow:hidden;contain:strict;background:var(--c);color:var(--t)}
.pc.tiny .sl>*{visibility:hidden}
.pc[data-k=panel],.pc[data-k=wordmark],.pc[data-k=readout],.pc[data-k=trace],.pc[data-k=text]{cursor:grab}
.pc:focus-visible{outline:none}

/* measuring ruler that every panel carries along its foot */
.ruler{position:absolute;left:var(--rl,12px);right:var(--rr,12px);bottom:10px;height:9px;
  background:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 8px) bottom/100% 4px no-repeat,
             repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 40px) bottom/100% 9px no-repeat;opacity:.55}
.dim{position:absolute;font:500 11px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dim.br{right:var(--rr,14px);bottom:26px}
.dim.tl{left:var(--rl,14px);top:14px}
.reg{position:absolute;width:15px;height:15px}
.reg::before,.reg::after{content:"";position:absolute;background:currentColor}
.reg::before{left:7px;top:0;width:1px;height:15px}.reg::after{top:7px;left:0;height:1px;width:15px}

/* grip: the visible pick-up button in every slab's notch */
.grip{position:absolute;width:30px;height:30px;display:grid;place-items:center;z-index:3;touch-action:none}
.grip i{width:10px;height:14px;background:radial-gradient(circle,currentColor 1.3px,transparent 1.6px) 0 0/5px 5px;opacity:.8}
.grip:hover i,.pc.lift .grip i{opacity:1}

/* wordmark: each word is its own absolutely set line of type */
.wm{position:absolute;left:0;top:0;white-space:nowrap;font-weight:820;line-height:1;text-transform:uppercase;transform-origin:0 0;letter-spacing:-.005em;will-change:transform;font-kerning:normal}

/* dial */
.dial{position:absolute;inset:0}
.dial svg.ring{position:absolute;left:50%;top:50%;touch-action:none;cursor:grab;overflow:visible}
.dial svg.ring:active{cursor:grabbing}
.dial .dv{position:absolute;left:0;right:0;text-align:center;font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums}
.dial .ptr{position:absolute;left:50%;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid currentColor;transform:translateX(-50%)}
.st{position:absolute;width:44px;height:44px;display:grid;place-items:center}
.st svg{width:20px;height:20px}

/* slider */
.sld{position:absolute;inset:0;touch-action:none;cursor:ew-resize}
.sld .trk{position:absolute;height:12px;background:var(--ink);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
html.light .sld .trk{background:var(--ink)}
.sld .fill{position:absolute;left:0;top:0;bottom:0;background:var(--t);opacity:.9}
.sld .th{position:absolute;width:26px;height:40px;background:var(--t);clip-path:polygon(50% 0,100% 8%,100% 92%,50% 100%,0 92%,0 8%)}
.sld .sv{position:absolute;font:600 12px/1 var(--mono);font-variant-numeric:tabular-nums}

/* toggles */
.tgs{position:absolute;display:grid;gap:10px 14px}
.tg{position:relative;display:flex;align-items:center;gap:calc(var(--th,24px)*.45);min-height:44px;min-width:44px}
.tg .tk{position:relative;width:var(--tw,54px);height:var(--th,24px);flex:none;background:var(--ink);clip-path:polygon(calc(var(--th,24px)*.16) 0,100% 0,calc(100% - var(--th,24px)*.16) 100%,0 100%)}
.tg .kn{position:absolute;top:calc(var(--th,24px)*.1);left:0;width:calc(var(--th,24px)*.72);height:calc(var(--th,24px)*.8);background:var(--dim);clip-path:polygon(50% 0,100% 8%,100% 92%,50% 100%,0 92%,0 8%);will-change:transform}
.tg[aria-checked=true] .kn{background:var(--t2,#fafaf7)}
.tg svg{width:var(--ic,22px);height:var(--ic,22px);flex:none}
.tgs.col .tg{gap:12px}

/* menu */
.mn{position:absolute;display:flex;flex-direction:column;overflow:hidden}
.mn button{display:flex;align-items:center;gap:calc(var(--rh,40px)*.3);height:var(--rh,40px);flex:none;padding:0 10px;font:600 calc(var(--rh,40px)*.33)/1 var(--mono);font-variant-numeric:tabular-nums;text-align:left;position:relative}
.mn button svg{height:calc(var(--rh,40px)*.68);width:auto;aspect-ratio:46/28;flex:none}
.mn button[aria-current=true]{background:var(--ink);color:var(--paper);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.mn button:hover:not([aria-current=true]){background:color-mix(in oklab,var(--ink) 16%,transparent)}
.mn .nm{font:700 calc(var(--rh,40px)*.38)/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* readout */
.ro{position:absolute;font-family:var(--mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:space-between}
.ro .big{font-weight:700;line-height:.86;letter-spacing:-.03em}
.ro .ln{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:500;white-space:nowrap}
.ro .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.ro .bars i{width:3px;background:currentColor}

/* trace */
.trc{position:absolute;display:block}

/* field */
.fld{position:absolute;display:flex;align-items:center}
.fld input{width:100%;height:100%;background:var(--ink);color:var(--paper);border:0;font:700 34px/1 var(--mono);letter-spacing:.12em;padding:0 16px;caret-color:var(--c);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);outline:none;user-select:text;-webkit-user-select:text;font-variant-numeric:tabular-nums;touch-action:manipulation}
.fld input:focus-visible{box-shadow:inset 0 0 0 3px var(--c)}

/* hex button */
.hx{position:absolute;inset:0;display:grid;place-items:center}
.hx svg{width:46%;max-width:76px;height:auto}

/* text */
.tx{position:absolute;font-weight:520;line-height:1.14;text-wrap:balance}

/* link button in creations */
.lnk{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:700 18px/1 var(--disp);color:inherit;text-decoration:none}
.lnk svg{width:26px;height:26px}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}

/* overlay: onion skin + focus ring */
#ov{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:visible}
#ov path{fill:none;vector-effect:non-scaling-stroke}

/* overview */
#over{position:fixed;inset:0;z-index:15;pointer-events:none}
#over.on{pointer-events:auto}
#over canvas{position:absolute;inset:0}
#over button{position:absolute;background:transparent}
#over button:focus-visible{outline:none}

/* rail */
#rail{position:fixed;z-index:30;display:flex;gap:6px;align-items:center}
#rail button,#rail .ix{height:44px;min-width:44px;display:grid;place-items:center;background:var(--ink2);color:var(--paper);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:0 12px}
html.light #rail button,html.light #rail .ix{color:var(--paper)}
#rail button.hex{clip-path:polygon(50% 0,100% 8%,100% 92%,50% 100%,0 92%,0 8%);width:40px;min-width:40px;padding:0}
#rail button svg{width:20px;height:20px}
#rail button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
html.light #rail button[aria-pressed=true]{background:#b87333;color:var(--ink)}
#rail button:hover{background:var(--ink3)}
#rail button[aria-pressed=true]:hover{background:#e9e4d6}
#rail .ix{font:600 14px/1 var(--mono);font-variant-numeric:tabular-nums;gap:8px;display:flex;align-items:center;min-width:94px;justify-content:center;cursor:default}
#rail .ix svg{width:18px;height:10px}
#rail .scr{position:relative;width:200px;height:44px;touch-action:none;cursor:ew-resize}
#rail .scr .bd{position:absolute;left:0;right:0;top:20px;height:4px;background:var(--ink2)}
#rail .scr .tk{position:absolute;top:14px;width:2px;height:16px;background:var(--dim)}
#rail .scr .hd{position:absolute;top:8px;width:14px;height:28px;margin-left:-7px;background:var(--fg);clip-path:polygon(50% 0,100% 8%,100% 92%,50% 100%,0 92%,0 8%)}
#rail .sep{width:10px}
#rail .tiltb{display:none}
#rail.has-tilt .tiltb{display:grid}

/* designed focus: an inset paper-and-ink double stroke inside kit shapes, drawn ring for pieces lives in #ov */
#rail button:focus-visible,#rail .scr:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--ink)}
.sl button:focus-visible,.sl [role=slider]:focus-visible,.grip:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.dial svg.ring:focus-visible{outline:none}
.dial svg.ring:focus-visible .face{stroke:var(--t);stroke-width:3}

#grain{position:fixed;inset:-50%;width:200%;height:200%;z-index:40;pointer-events:none;opacity:.05}
html.light #grain{opacity:.07;mix-blend-mode:multiply}

#nojs{position:fixed;left:4vw;top:4vh;right:4vw;font:820 12vw/0.84 var(--disp);font-stretch:80%;text-transform:uppercase;color:var(--paper);margin:0}
.js #nojs{display:none}

/* exploration treatments (B folded paper, C interlock). Only A ships. */
html.t-b .sl::after{content:"";position:absolute;right:0;top:0;width:var(--n,20px);height:var(--n,20px);background:rgba(11,13,20,.28);clip-path:polygon(0 0,0 100%,100% 100%)}
html.t-b .pc{filter:drop-shadow(8px 9px 0 rgba(11,13,20,.9))}
html.t-b .wm{font-weight:380}

/* a creation's title, where a filled spot's component used to show a number */
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 40px)}
.dial .dv.tt{max-width:none;padding:0 14%}
.ro .big.tt{max-width:100%;font-family:var(--disp);font-weight:860;font-stretch:80%;line-height:1}
.dim.tt{font:700 14px/1.1 var(--disp);max-width:60%}

/* the window inside a filled spot's dashed outline */
#win{position:fixed;left:0;top:0;z-index:19;pointer-events:none;overflow:hidden;display:none;contain:strict}
#win .wi{position:absolute;left:0;top:0;transform-origin:0 0}
#win .wi>*{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
#win .wi>[hidden]{display:none}
#win .wc{background:var(--ink2);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:8% 10%;box-sizing:border-box}
#win .wc b{font-family:var(--disp);font-weight:860;font-stretch:80%;line-height:.95;text-transform:uppercase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#win .wc span{font:600 12px/1.2 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#win .wa{background:#0b0d14 center/cover no-repeat}
#win .wa canvas{position:absolute;inset:0;width:100%;height:100%}
#win img,#win video{object-fit:cover}

/* search and tags, part of the rail */
#rail .fnd{display:flex}
#rail .fnd input,#find .frow input{height:44px;width:200px;box-sizing:border-box;border:0;outline:none;background:var(--ink2);color:var(--paper);font:600 13px/1 var(--mono);padding:0 18px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);user-select:text;-webkit-user-select:text;border-radius:0}
#rail .fnd input::placeholder,#find .frow input::placeholder{color:var(--dim)}
#rail .fnd input:focus-visible,#find .frow input:focus-visible{box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--ink)}
#find{position:fixed;z-index:31;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;background:var(--ink2);color:var(--paper);overflow:auto;overscroll-behavior:contain;touch-action:pan-y;
  clip-path:polygon(10px 0,calc(100% - 14px) 0,100% 14px,calc(100% - 10px) 100%,14px 100%,0 calc(100% - 14px));user-select:none}
#find[hidden]{display:none}
#find .frow input{width:100%;background:var(--ink);font-size:16px}
#find .ftags{display:flex;flex-wrap:wrap;gap:6px}
#find .ftags button{height:32px;padding:0 14px;font:600 12px/1 var(--mono);background:var(--ink);color:var(--paper);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#find .ftags button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
#find .fres{display:flex;flex-direction:column;gap:4px}
#find .fres button{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:10px 18px;background:var(--ink);color:var(--paper);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);min-height:44px}
#find .fres button b{font:700 17px/1.1 var(--disp);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#find .fres button span{font:500 11px/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
#find .fres button:hover,#find .ftags button:hover:not([aria-pressed=true]){background:var(--ink3)}
#find button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--ink)}
#find .fnone{margin:0;font:500 12px/1.3 var(--mono);color:var(--dim)}

</style>
</head>

<script>
(function(){
'use strict';
/* ---------- basics ---------- */
const D=document, H=D.documentElement;
H.classList.add('js');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeO=t=>1-Math.pow(1-t,3);
const now=()=>performance.now();
const el=(tag,cls,parent)=>{const e=D.createElement(tag);if(cls)e.className=cls;if(parent)parent.insertBefore(e,null);return e;};
const svgNS='http://www.w3.org/2000/svg';
function mulberry(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pad=(n,l=3)=>String(Math.max(0,Math.round(n))).padStart(l,'0');
const RM=matchMedia('(prefers-reduced-motion: reduce)');
/* treatment: the kit's language. Exploration renders used ?t=b and ?t=c; the page ships treatment A. */
const TR=(()=>{const q=(location.search.match(/[?&]t=([abc])/)||[])[1]||'c';
  /* Stage-1 exploration kept selectable for the record: ?t=a machined, ?t=b folded. The page ships C, interlock. */
  const T={a:{name:'machined',lean:.05,notch:1,gutter:1,weight:820,k:175,z:.58,plotter:true},
           b:{name:'folded',lean:0,notch:1.9,gutter:2.2,weight:380,k:105,z:.78,plotter:false,theme:'light',fold:true},
           c:{name:'interlock',lean:.16,leanMode:'h',notch:.7,gutter:.3,weight:860,k:230,z:.6,plotter:true,fill:true}}[q];
  document.documentElement.classList.add('t-'+q);return T;})();

/* ---------- colour (OKLab mixing, WCAG contrast) ---------- */
const hex2rgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];};
const toLin=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);
const toSrgb=c=>c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055;
function rgb2lab(rgb){const[r,g,b]=rgb.map(toLin);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s];}
function lab2rgb([L,a,b]){const l=Math.pow(L+.3963377774*a+.2158037573*b,3),m=Math.pow(L-.1055613458*a-.0638541728*b,3),s=Math.pow(L-.0894841775*a-1.291485548*b,3);
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(v=>clamp(toSrgb(clamp(v,0,1)),0,1));}
const mixLab=(p,q,t)=>[lerp(p[0],q[0],t),lerp(p[1],q[1],t),lerp(p[2],q[2],t)];
const rgbCss=c=>'rgb('+(c[0]*255|0)+','+(c[1]*255|0)+','+(c[2]*255|0)+')';
const lum=c=>{const[r,g,b]=c.map(toLin);return .2126*r+.7152*g+.0722*b;};
const contrast=(a,b)=>{const A=lum(a),B=lum(b);return(Math.max(A,B)+.05)/(Math.min(A,B)+.05);};
const INK=hex2rgb('#0b0d14'),PAPER=hex2rgb('#fafaf7');
/* The ring: the Studios hues ordered by hue so a shift slides between neighbours. No gold. */
const RING_HEX=['#ff8c42','#b87333','#6a9a5a','#00b4d8','#3f51b5','#9c6dff','#ffa8d0'];
const RING=RING_HEX.map(h=>rgb2lab(hex2rgb(h)));
const PILLAR={identity:1,digital:3,physical:2,signal:6,system:5};
const NEUTRAL={dark:{slab:rgb2lab(hex2rgb('#1b2030')),paper:rgb2lab(hex2rgb('#fafaf7'))},light:{slab:rgb2lab(hex2rgb('#0b0d14')),paper:rgb2lab(hex2rgb('#e7e1d1'))}};

/* ---------- springs ---------- */
class SV{ // a bundle of independent 1-D springs
  constructor(vals){this.n=vals.length;this.v=Float64Array.from(vals);this.t=Float64Array.from(vals);this.u=new Float64Array(this.n);}
  set(i,t){this.t[i]=t;} snap(){this.v.set(this.t);this.u.fill(0);}
  step(dt,k,z){const c=2*z*Math.sqrt(k);let e=0;for(let i=0;i<this.n;i++){const a=-k*(this.v[i]-this.t[i])-c*this.u[i];this.u[i]+=a*dt;this.v[i]+=this.u[i]*dt;e+=Math.abs(this.u[i]);}return e;}
}

/* ---------- shapes ---------- */
const HEX='polygon(50% 0,100% 8%,100% 92%,50% 100%,0 92%,0 8%)';
/* The Studios slant: the top edge is pushed 5% of the slab's width along, exactly as the Studios
   draw it. A slab leans harder the wider it stretches, so stretching is visible in its angle. */
function slabPts(w,h,dir,n,leanMul){
  const dx=Math.min(w*.05*leanMul,h*.9);
  let P=dir>0?[[dx,0],[w,0],[w-dx,h],[0,h]]:[[0,0],[w-dx,0],[w,h],[dx,h]];
  n=Math.min(n,w*.22,h*.3);
  if(n<1)return{P,dx};
  const cut=dir>0?[1,3]:[0,2],out=[];
  for(let i=0;i<4;i++){const p=P[i];if(cut.indexOf(i)<0){out.push(p);continue;}
    const a=P[(i+3)%4],b=P[(i+1)%4];
    const da=Math.hypot(a[0]-p[0],a[1]-p[1])||1,db=Math.hypot(b[0]-p[0],b[1]-p[1])||1;
    out.push([p[0]+(a[0]-p[0])/da*n,p[1]+(a[1]-p[1])/da*n],[p[0]+(b[0]-p[0])/db*n,p[1]+(b[1]-p[1])/db*n]);}
  return{P:out,dx};
}
const polyCss=P=>'polygon('+P.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')+')';
const polyPath=(P,ox,oy)=>'M'+P.map(p=>(p[0]+ox).toFixed(1)+' '+(p[1]+oy).toFixed(1)).join('L')+'Z';

/* ---------- drawn icon set (one stroke weight, one lean) ---------- */

  mute:'<path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="m15 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="2"/>',
  theme:'<path d="M12 2 21 4v16l-9 2-9-2V4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v20l-9-2V4z" fill="currentColor"/>',
  tilt:'<path d="m8.5 2.6 9 2.2-4 16.6-9-2.2z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 8c0-3 2-5 4-6M22 16c0 3-2 5-4 6" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  swap:'<path d="M5 4h9l-2 7H3zM12 13h9l-2 7h-9z" fill="currentColor"/><path d="M17 3l3 3-3 3M7 15l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  plus:'<path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6"/>',

const icon=(n,vb)=>'<svg viewBox="'+(vb||'0 0 24 24')+'" aria-hidden="true" focusable="false">'+IC[n]+'</svg>';

/* ---------- screen classes: each one composed on purpose ---------- */
function classify(W,Hh){
  if(Hh<=520&&W>Hh)return'phoneL';
  if(W<700)return'phone';
  if(W<1100&&Hh>W)return'tablet';
  if(W>=2300)return'ultra';
  if(W<1400||Hh<760)return'laptop';
  return'desk';
}
function metrics(W,Hh,tight){
  const cls=classify(W,Hh);let C,R,m,g,railB=0,railR=0,spine=0,notch;
  switch(cls){
    case'ultra':C=32;R=12;m=Math.round(clamp(W*.02,44,84));g=Math.round(clamp(W*.006,14,24));railB=84;notch=22;break;
    case'desk':C=24;R=12;m=Math.round(clamp(W*.024,30,48));g=Math.round(clamp(W*.0072,10,16));railB=70;notch=16;break;
    case'laptop':C=24;R=12;m=Math.round(clamp(W*.02,20,30));g=Math.round(clamp(W*.0068,8,11));railB=62;notch=13;break;
    case'tablet':C=12;R=16;m=26;g=12;railB=84;spine=0;notch=14;break;
    case'phone':C=8;R=16;m=14;g=8;railB=86;spine=22;notch=11;break;
    case'phoneL':C=20;R=8;m=12;g=8;railR=68;spine=18;notch=10;break;
  }
  g=Math.round(g*TR.gutter);notch=Math.round(notch*TR.notch);if(tight){g=TR.fill?Math.round(clamp(W*.02,14,56)):0;}
  const top=cls==='phone'||cls==='phoneL'?Math.max(m,parseFloat(getComputedStyle(H).getPropertyValue('--sat'))||0):m;
  const sx=m,sy=top,sw=W-2*m-railR,sh=Hh-top-m-railB-spine;
  return{cls,C,R,m,g,sx,sy,sw,sh,cw:(sw+g)/C,rh:(sh+g)/R,railB,railR,spine,notch,W,H:Hh,touchy:cls==='phone'||cls==='phoneL'||cls==='tablet'};
}
function cellRect(M,gx,gy,gw,gh,mirror){
  if(mirror)gx=M.C-gx-gw;
  return{x:M.sx+gx*M.cw,y:M.sy+gy*M.rh,w:gw*M.cw-M.g,h:gh*M.rh-M.g};
}

  'W 3 0 21 8 p|D 0 0 3 6|H 0 6 3 3|J 0 9 3 3|S 3 8 11 1|T 3 9 6 3|F 9 9 5 3|C 14 8 6 4|R 20 8 4 2|P 20 10 4 2'
 ],

  'W 0 0 10 12|C 10 0 13 5|D 23 0 3 5|H 26 0 3 5|M 29 0 3 12|S 10 5 19 1|T 10 6 7 3|R 17 6 6 3|P 23 6 6 6|F 10 9 7 3|J 17 9 3 3|P2 20 9 3 3',

  'C 0 0 12 4|W 0 4 12 4 p|D 0 8 4 8|T 4 8 8 2|S 4 10 8 1|R 4 11 4 3|M 8 11 4 5|F 4 14 4 2'
 ]
};
/* phones: one piece in focus, two beneath, the rest folded to spines in thumb reach */
const PHONE_FOCUS=['dial','toggles','trace','slider','menu','readout','field'];
const PHONE_V=[
  {W:[0,0,8,4],F:[0,4,8,8],A:[0,12,4,4],B:[4,12,4,4]},
  {F:[0,0,8,8],W:[0,8,8,4],A:[0,12,5,4],B:[5,12,3,4]},
  {W:[0,0,3,12],F:[3,0,5,8],A:[3,8,5,4],B:[0,12,8,4]}

  else{S.jump={P:makePlan(A,S.bind,B,{spread:spread!=null?spread:(shift?.3:.18)}),t:0,dur:S.reduced?.35:(shift||.75),silent:true};}

function jumpTo(idx,dur){

/* ---------- type measurement (once the faces are in) ---------- */
const MEAS={ready:false,cache:new Map(),asc:.9,cap:.7};
function measureWord(w){
  let m=MEAS.cache.get(w);if(m)return m;
  const s=MEAS.span;m=[];
  for(const wd of[50,75,100,125,150]){s.style.fontStretch=wd+'%';s.textContent=w;m.push(s.getBoundingClientRect().width/100);}
  MEAS.cache.set(w,m);return m;
}
function widthAt(m,wd){const t=(clamp(wd,50,150)-50)/25,i=Math.min(3,Math.floor(t));return lerp(m[i],m[i+1],t-i);}
function solveWd(m,target){ // width-axis value that makes this line exactly target em wide
  if(target<=m[0])return 50;if(target>=m[4])return 150;
  for(let i=0;i<4;i++)if(target<=m[i+1])return 50+25*(i+(target-m[i])/(m[i+1]-m[i]||1));return 150;
}
function initMeasure(){
  const s=el('span','',D.body);s.style.cssText='position:absolute;left:-9999px;top:0;font:'+TR.weight+' 100px/1 '+(TR.mono?'Martian':'Anybody')+';text-transform:uppercase;white-space:pre;visibility:hidden';
  MEAS.span=s;
  try{const c=D.createElement('canvas').getContext('2d');c.font=TR.weight+' 100px '+(TR.mono?'Martian':'Anybody');const m=c.measureText('HDGS');
    const fa=m.fontBoundingBoxAscent,fd=m.fontBoundingBoxDescent;
    if(fa){MEAS.cap=m.actualBoundingBoxAscent/100;MEAS.top=((100-(fa+fd))/2+fa-m.actualBoundingBoxAscent)/100;}}catch(e){}
  if(MEAS.top==null){MEAS.top=.2;}
  MEAS.ready=true;MEAS.cache.clear();
}

/* ---------- small helpers for kinds ---------- */
function tick(kind){if(S.sound)SOUND.play(kind);if(S.pointer.type==='touch'&&navigator.vibrate)try{navigator.vibrate(kind==='lift'?18:kind==='drop'?10:6);}catch(e){}}
const pctOf=(w,h,dir)=>Math.min(w*.05*(dir||1),h*.9);

/* The wordmark: words set as separate lines of one display face; the width axis justifies every
   line to the slab, so the type squeezes and stretches as the slab is reshaped. */
KINDS.wordmark={
  build(p,d){p.words=[];p.wb=el('div','',p.sl);p.wb.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0';p.rv=new SV([0]);this.setData(p,d);p.el.setAttribute('aria-hidden',d&&d.words?'false':'true');},
  setData(p,d){
    const words=(d&&d.words&&d.words.length?d.words:['Great','Creation','Studios']);
    const old=p.words;
    if(old.length&&old.map(o=>o.t).join(' ')===words.join(' '))return;
    const nw=words.map((t,i)=>{const o=old[i];const e=o?o.e:el('span','wm',p.wb);
      const w={t,e,sv:o?o.sv:new SV([0,0,10,100,1,0]),pend:null};
      if(o&&o.t!==t){w.pend=t;w.sv.set(4,0);w.t=o.t;}else{e.textContent=t;}
      return w;});
    for(let i=words.length;i<old.length;i++)old[i].e.remove();
    if(!old.length)p.fresh=true;
    p.words=nw;p.lw=-1;
    if(d&&d.words)p.el.setAttribute('aria-label',words.join(' '));
  },
  layout(p,w,h,dx,dir){
    if(!MEAS.ready||w<8||h<8)return;
    // in a tower the wordmark tips onto its side and runs up the slab
    const vert=w/h<(p.vert?1:.9)&&p.words.length>1;p.vert=vert;p.rv.set(0,vert?1:0);p.hh=h;
    if(vert){const t=w;w=h;h=t;dx=0;}
    const words=p.words,n=words.length,ar=w/h;
    let L=S.tog.stack&&!p.data.words?n:(ar>4.6?1:ar>1.7&&n>=2?2:n);
    if(n===1)L=1;
    L=Math.min(L,n);
    // split words into L lines, balancing measured width
    const ms=words.map(o=>measureWord(o.pend||o.t)),sp=measureWord(' ');
    const lines=[];{let total=ms.reduce((a,m)=>a+m[2],0),per=total/L,acc=0,cur=[];
      words.forEach((o,i)=>{cur.push(i);acc+=ms[i][2];if(lines.length<L-1&&acc>=per*(lines.length+1)-ms[i][2]*.35&&n-i-1>=L-lines.length-1){lines.push(cur);cur=[];}});if(cur.length)lines.push(cur);}
    while(lines.length<L&&lines.some(l=>l.length>1)){const k=lines.findIndex(l=>l.length>1);lines.splice(k+1,0,[lines[k].pop()]);}
    const padX=Math.max(10,Math.min(w,h)*.06),padY=Math.max(8,h*.085);
    const avail=w-dx-padX*2,availH=h-padY*2,gap=.12;
    const lineEm=l=>wd=>l.reduce((a,i)=>a+widthAt(ms[i],wd),0)+(l.length-1)*widthAt(sp,wd);
    /* a justified block: every line fills the width exactly; the width axis and the size share the work,
       so short words set big and wide, long words condensed — and the block fills the slab's height */
    const F=lines.map(lineEm),lo=F.map(f=>avail/f(150)),hi=F.map(f=>avail/f(50));
    const Hof=t=>{let s=0;lines.forEach((l,i)=>{s+=lerp(lo[i],hi[i],t)*MEAS.cap;});const fsAvg=lines.reduce((a,l,i)=>a+lerp(lo[i],hi[i],t),0)/lines.length;return s+(lines.length-1)*gap*fsAvg;};
    let t=1,scale=1;
    if(Hof(1)>availH){if(Hof(0)>availH){t=0;scale=availH/Hof(0);}else{let a=0,b=1;for(let k=0;k<22;k++){const m=(a+b)/2;if(Hof(m)>availH)b=m;else a=m;}t=a;}}
    const fsL=lines.map((l,i)=>lerp(lo[i],hi[i],t)*scale);
    const fsAvg=fsL.reduce((a,b)=>a+b,0)/fsL.length;
    const blockH=fsL.reduce((a,f)=>a+f*MEAS.cap,0)+(lines.length-1)*gap*fsAvg;let capTop=padY+(availH-blockH)/2;
    lines.forEach((l,li)=>{
      const fs=fsL[li],f=F[li],target=avail/fs;
      let a=50,b=150;for(let k=0;k<18;k++){const m=(a+b)/2;if(f(m)<target)a=m;else b=m;}const wd=a;
      const lineW=f(wd)*fs,short=Math.max(0,avail-lineW);
      // what the width axis cannot reach is tracked out, so every line still lands flush on both edges
      const chars=l.reduce((a,i)=>a+(words[i].pend||words[i].t).length,0);
      const ls=chars>1?Math.min(short/(chars-1),fs*1.1):0,rest=short-ls*(chars-1);
      const extra=l.length>1?Math.max(0,rest)/(l.length-1):0;
      const yc=capTop+fs*MEAS.cap/2,left=(dir>0?dx*(1-yc/h):dx*(yc/h))+padX;
      let x=left;
      l.forEach(i=>{const o=words[i],n=(o.pend||o.t).length;o.sv.set(0,x);o.sv.set(1,capTop-fs*MEAS.top);o.sv.set(2,fs);o.sv.set(3,wd);o.sv.set(5,ls);
        x+=widthAt(ms[i],wd)*fs+ls*n+widthAt(sp,wd)*fs+extra;});
      capTop+=fs*MEAS.cap+gap*fsAvg;
    });

  },
  tick(p,dt){
    const k=S.reduced?520:340,z=S.reduced?1:.72;
    p.rv.step(dt,S.reduced?500:150,S.reduced?1:.62);const rv=p.rv.v[0],tf='translate(0,'+((p.hh||0)*rv).toFixed(1)+'px) rotate('+(-90*rv).toFixed(2)+'deg)';
    if(p.wtf!==tf){p.wtf=tf;p.wb.style.transform=tf;}
    for(const o of p.words){o.sv.step(dt,k,z);
      if(o.pend&&o.sv.v[4]<.04){o.t=o.pend;o.pend=null;o.e.textContent=o.t;o.sv.set(4,1);}
      const v=o.sv.v,key=(v[0]|0)+','+(v[1]|0)+','+v[2].toFixed(1)+','+v[3].toFixed(1)+','+v[4].toFixed(2)+','+v[5].toFixed(1);
      if(o.key!==key){o.key=key;o.e.style.transform='translate('+v[0].toFixed(1)+'px,'+v[1].toFixed(1)+'px) scaleX('+clamp(v[4],0,1.2).toFixed(3)+')';o.e.style.fontSize=v[2].toFixed(2)+'px';o.e.style.fontStretch=clamp(v[3],50,150).toFixed(1)+'%';o.e.style.letterSpacing=Math.max(-2,v[5]).toFixed(1)+'px';}
    }
  }
};

/* ---------- slab outline with a continuous lean: a=1 leans right, a=0 leans left, between is upright ---------- */
function slab(w,h,a,n,lm){
  const dx=TR.leanMode==='h'?Math.min(h*TR.lean*lm,w*.3):Math.min(w*TR.lean*lm,h*.9);
  const P=[[dx*a,0],[w-dx*(1-a),0],[w-dx*a,h],[dx*(1-a),h]];
  const k=Math.abs(2*a-1);n=Math.min(n,w*.22,h*.3)*k;
  if(n<.6)return{P,dx};
  const cut=a>=.5?[1,3]:[0,2],out=[];
  for(let i=0;i<4;i++){const p=P[i];if(cut.indexOf(i)<0){out.push(p);continue;}
    const A=P[(i+3)%4],B=P[(i+1)%4],da=Math.hypot(A[0]-p[0],A[1]-p[1])||1,db=Math.hypot(B[0]-p[0],B[1]-p[1])||1;
    out.push([p[0]+(A[0]-p[0])/da*n,p[1]+(A[1]-p[1])/da*n],[p[0]+(B[0]-p[0])/db*n,p[1]+(B[1]-p[1])/db*n]);}
  return{P:out,dx};
}

/* ---------- inputs bookkeeping ---------- */
function markInput(){S.lastInput=now();if(S.auto&&!S.auto.user)S.auto=null;}
function announce(t){const l=D.getElementById('live');if(l)l.textContent=t;}
function go(d){
  markInput();if(S.over.open)return;
  if(count()<=1){S.forceJump=true;jumpTo(S.a,.9);return;}
  const base=S.auto?S.auto.to:S.pos;
  const to=d>0?Math.floor(base+1e-6)+1:Math.ceil(base-1e-6)-1;
  S.auto={from:S.pos,to,t:0,dur:S.reduced?.7:(S.M.touchy?.9:1.2),user:true,io:true};
}
function startAuto(){const to=Math.round(S.pos)+1;S.auto={from:S.pos,to,t:0,dur:S.reduced?1.2:(S.M.touchy?1.1:1.55)};}
function setHold(v){S.hold=v;markInput();announce(v?'Held':'Rehearsing');const b=D.querySelector('#rail .holdb');if(b){b.setAttribute('aria-pressed',String(v));b.innerHTML=icon(v?'play':'pause');}}
function setSeed(v){S.seed=v;LS.set('seed',v);S.cache.clear();S.forceJump=true;jumpTo(S.a);announce('Seed '+v);}

/* ---------- arrivals ---------- */
function onArrive(){
  const c=S.bindComp;announce(c.label);
  try{history.replaceState(null,'','#/'+c.key);}catch(e){}
  for(const p of S.bind)if(p&&p.K.arrive)p.K.arrive(p);
  if(c.creation){S.seen[c.creation.id]=c.creation.version||'1';LS.set('seen',S.seen);}
  if(S.sound)SOUND.play('arrive');
  layoutSpines();updateRail();findArrive();
}

/* ---------- the frame ---------- */
let last=now(),acc=0,fpsN=0;
S.energyHist=new Float32Array(64);S.ehi=0;
function frame(){
  const t=now();let dt=(t-last)/1000;last=t;
  if(dt>0){acc+=dt;fpsN++;if(acc>.5){S.fps=Math.round(fpsN/acc);acc=0;fpsN=0;}}
  dt=clamp(dt,0,1/24);
  // drive position
  let P=null,f=0;
  if(S.jump){S.jump.t+=dt;f=clamp(S.jump.t/S.jump.dur,0,1);P=S.jump.P;
    if(f>=1){const J=S.jump;S.jump=null;rebindTo(J.P);S.pos=S.goal=S.a;P=null;f=0;}}
  if(!S.jump){
    if(S.auto){S.auto.t+=dt;const k=clamp(S.auto.t/S.auto.dur,0,1);S.pos=lerp(S.auto.from,S.auto.to,S.auto.user&&!S.auto.io?easeO(k):ease(k));S.goal=S.pos;if(k>=1){S.pos=S.goal=S.auto.to;S.auto=null;}}
    else if(!S.scrubbing){S.pos+=(S.goal-S.pos)*(1-Math.exp(-dt*9));if(Math.abs(S.goal-S.pos)<2e-4)S.pos=S.goal;}
    P=currentPlan();
    let guard=0;while(P&&Math.abs(S.pos-S.a)>=1-1e-6&&guard++<40){rebindTo(P);P=currentPlan();}
    f=P?Math.abs(S.pos-S.a):0;
  }
  // the rehearsal keeps going on its own
  if(!S.hold&&!S.jump&&!S.auto&&!S.lift&&!S.over.open&&!S.scrubbing&&!(S.preview&&S.preview.pin&&S.preview.on)&&count()>1&&D.visibilityState==='visible'){
    const dwell=S.reduced?12000:(S.mode==='cat'?9000:4300);
    if(t-S.lastInput>7000&&t-S.lastArrive>dwell&&Math.abs(S.goal-S.pos)<1e-3)startAuto();
  }
  // targets
  const tg=new Map();
  if(P){for(const tr of P.tracks){const g=evalTrack(tr,f);g.col=mixLab(specLab(tr.fc),specLab(tr.tc),ease(g.s));tg.set(tr.p,g);
      if(tr.mode==='keep'&&tr.data!==tr.adata){const want=g.s>=.5?tr.data:tr.adata;if(tr.p.data!==want){tr.p.data=want;tr.p.K.setData&&tr.p.K.setData(tr.p,want);}}}}
  else{S.bindComp.slots.forEach((s,i)=>{const p=S.bind[i];if(p)tg.set(p,{x:s.rect.x,y:s.rect.y,w:s.rect.w,h:s.rect.h,col:specLab(s.col),s:1});});}
  // modifiers: fan, lean to the cursor, tilt, lift
  const M=S.M,touchy=M.touchy,reduced=S.reduced;
  const dialP=[...tg.keys()].find(p=>p.kind==='dial'&&p.data.global);
  const fan=S.dial/360;let pivot=null;
  if(dialP&&fan>.001){const g=tg.get(dialP);pivot=[g.x+g.w/2,g.y+g.h/2];}
  const list=[...tg.entries()];
  if(pivot){list.filter(([p])=>p!==dialP).map(([p,g])=>[p,g,Math.hypot(g.x+g.w/2-pivot[0],g.y+g.h/2-pivot[1])]).sort((a,b)=>a[2]-b[2]).forEach(([p,g],r,arr)=>{
      const ang=fan*(reduced?14:30)*((r+1)/arr.length)*(r%2?1:-1)*(S.tog.mirror?-1:1),rad=ang*Math.PI/180,cx=g.x+g.w/2-pivot[0],cy=g.y+g.h/2-pivot[1];
      const nx=pivot[0]+cx*Math.cos(rad)-cy*Math.sin(rad),ny=pivot[1]+cx*Math.sin(rad)+cy*Math.cos(rad);g.x=nx-g.w/2;g.y=ny-g.h/2;g.r=ang;});}

      for(let c=-Math.ceil(cols/2);c<=Math.ceil(cols/2);c++){const x=cx+c*(mw+g)+off,y=cy+(r-mid)*(mh+g);
        if(x+mw<-mw*.2||x>W+mw*.2)continue;out.push({idx:S.a+(r-mid)*cols+c,x,y,w:mw,h:mh,s,r,c});}}
    return out;}

  for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols;out.push({idx:base+i,x:x0+c*(mw+g)+(r%2?(mw+g)/2:0),y:y0+r*(mh+g),w:mw,h:mh,s,r,c});}

    if(e.key==='Backspace'&&S.lift){drop(true);return;}
    if(e.altKey||e.metaKey)return;
    if((e.ctrlKey&&(e.key==='-'||e.key==='_'))){e.preventDefault();openOverview();return;}
    if(e.ctrlKey)return;
    if(e.key==='o'||e.key==='O'){e.preventDefault();openOverview();return;}
    if(e.shiftKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();markInput();S.auto=null;S.goal+=e.key==='ArrowRight'?.1:-.1;return;}
    if(['ArrowRight','ArrowDown','PageDown',']'].includes(e.key)&&!isCtl(e.target)){e.preventDefault();go(1);return;}
    if(['ArrowLeft','ArrowUp','PageUp','['].includes(e.key)&&!isCtl(e.target)){e.preventDefault();go(-1);return;}
    if(e.key==='h'||e.key==='H'||(e.key===' '&&e.target===S.stage)){e.preventDefault();setHold(!S.hold);return;}
    if(e.key==='Enter'&&(e.target===S.stage||e.target===D.body)){const c=S.bindComp.creation;if(c&&c.link)location.href=c.link;return;}
  });
  addEventListener('pointerdown',()=>{S.kbd=false;},true);
  addEventListener('pointermove',e=>{S.pointer.x=e.clientX;S.pointer.y=e.clientY;S.pointer.in=true;S.pointer.type=e.pointerType;
    if(S.lift&&!S.lift.kb){S.lift.x=e.clientX-S.lift.ox;S.lift.y=e.clientY-S.lift.oy;}
    if(e.pointerType==='mouse'&&!PTR.size&&!S.lift){const p=pieceFrom(e.target);if(p!==S.hover){S.hover=p;clearTimeout(OVR.ht);endPreview();if(p)OVR.ht=setTimeout(()=>{if(S.hover===p)startPreview(p);},140);}}},{passive:true});
  D.addEventListener('pointerleave',()=>{S.pointer.in=false;S.hover=null;endPreview();});
  addEventListener('click',e=>{if(S.lift&&S.lift.armed&&!S.lift.kb&&!(e.target.closest&&e.target.closest('.grip'))){drop();}},true);
  st.addEventListener('contextmenu',e=>{if(S.pointer.type!=='mouse')e.preventDefault();});
  const overHost=D.getElementById('over');
  const down=e=>{
    if(S.over.open&&PTR.size===0&&e.pointerType==='mouse'&&!(e.target.closest&&e.target.closest('#over button'))){closeOverview();return;}
    S.pointer.type=e.pointerType;S.pointer.x=e.clientX;S.pointer.y=e.clientY;
    const p=pieceFrom(e.target);
    PTR.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:now(),p});
    if(!(e.target.closest&&e.target.closest('button,input,[role=slider],a')))try{st.setPointerCapture(e.pointerId);}catch(_){}
    if(PTR.size===2){clearTimeout(gest&&gest.hold);clearTimeout(gest&&gest.lp);if(gest&&gest.mode==='scrub')endScrub(0);
      const[a,b]=[...PTR.values()];const dialP=(a.p&&a.p.kind==='dial'&&a.p)||(b.p&&b.p.kind==='dial'&&b.p);
      gest={mode:dialP?'twist':'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),a0:Math.atan2(b.y-a.y,b.x-a.x),dialP};return;}
    if(PTR.size>2)return;
    markInput();
    if(S.over.open){gest={mode:'otap',p:null};return;}
    gest={mode:'idle',p,t0:now(),goal0:S.pos};
    if(e.pointerType!=='mouse'){
      gest.lp=setTimeout(()=>{if(gest&&gest.mode==='idle'&&p)startPreview(p);},170);
      gest.hold=setTimeout(()=>{if(gest&&gest.mode==='idle'&&p){endPreview();gest.mode='lift';toggleLift(p,{detail:1});}},400);
    }
  };
  st.addEventListener('pointerdown',down);overHost.addEventListener('pointerdown',down);
  const move=e=>{
    const q=PTR.get(e.pointerId);if(!q)return;q.x=e.clientX;q.y=e.clientY;
    if(!gest)return;
    if(gest.mode==='pinch'||gest.mode==='twist'){if(PTR.size<2)return;const[a,b]=[...PTR.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),ang=Math.atan2(b.y-a.y,b.x-a.x);
      if(gest.mode==='twist'){let da=(ang-gest.a0)*180/Math.PI;if(da>180)da-=360;if(da<-180)da+=360;gest.a0=ang;gest.dialP.twist(da);return;}
      const r=d/gest.d0;if(r<.72&&!S.over.open){openOverview();gest.mode='done';}else if(r>1.35&&S.over.open){closeOverview();gest.mode='done';}return;}
    const dx=q.x-q.x0,dy=q.y-q.y0,dd=Math.hypot(dx,dy);
    if(gest.mode==='otap')return;
    if(gest.mode==='idle'){
      if(e.pointerType==='mouse'&&dd>5){if(gest.p&&DRAGGABLE[gest.p.kind]){gest.mode='lift';const v=gest.p.sv.v;S.pointer.x=q.x0;S.pointer.y=q.y0;toggleLift(gest.p,{detail:1});S.lift.ox=q.x0-v[0];S.lift.oy=q.y0-v[1];}else{gest.mode='scrub';beginScrub();}}
      else if(e.pointerType!=='mouse'&&dd>10){clearTimeout(gest.hold);clearTimeout(gest.lp);endPreview();gest.mode='scrub';beginScrub();}
    }
    if(gest.mode==='scrub'&&count()>1){const ax=Math.abs(dx)>Math.abs(dy)?-dx/S.M.W:-dy/S.M.H;S.pos=S.goal=gest.goal0+ax*1.1;
      const t=now();gest.vel=lerp(gest.vel||0,(S.pos-(gest.lp2||S.pos))/Math.max(.001,(t-(gest.lt||t))/1000),.35);gest.lp2=S.pos;gest.lt=t;}
    if(gest.mode==='lift'&&S.lift){S.lift.x=q.x-S.lift.ox;S.lift.y=q.y-S.lift.oy;}
  };
  st.addEventListener('pointermove',move);overHost.addEventListener('pointermove',move);
  const up=e=>{
    const q=PTR.get(e.pointerId);PTR.delete(e.pointerId);if(!gest)return;
    clearTimeout(gest.hold);clearTimeout(gest.lp);
    if(gest.mode==='twist'){if(PTR.size<2){gest.dialP.twistEnd();gest=null;}return;}
    if(gest.mode==='pinch'||gest.mode==='done'){if(!PTR.size)gest=null;return;}
    if(gest.mode==='scrub')endScrub(e.pointerType==='mouse'?null:gest.vel||0);
    if(gest.mode==='lift'&&S.lift)drop();
    if(gest.mode==='idle'){endPreview();}
    if(gest.mode==='otap'&&q&&Math.hypot(q.x-q.x0,q.y-q.y0)<10&&!(e.target.closest&&e.target.closest('#over button'))){closeOverview();}
    gest=null;
  };
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);overHost.addEventListener('pointerup',up);overHost.addEventListener('pointercancel',up);
  addEventListener('hashchange',fromHash);
}
const isCtl=t=>t&&t.closest&&t.closest('[role=slider],[role=switch],input,.mn,#over');
function beginScrub(){S.scrubbing=true;S.auto=null;if(S.jump){rebindTo(S.jump.P);S.jump=null;S.pos=S.goal=S.a;}}
function endScrub(vel){S.scrubbing=false;markInput();
  if(vel==null){S.goal=S.pos;return;} // mouse: stays exactly where you let go, mid-shift if you like
  const to=Math.round(S.pos+clamp(vel*.22,-.6,.6));S.auto={from:S.pos,to,t:0,dur:S.reduced?.4:.55,user:true};}
function fromHash(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));if(!h)return null;
  if(S.mode==='cat'){const i=CREATIONS.findIndex(c=>c.id===h);if(i<0)return null;const base=S.a-mod(S.a,CREATIONS.length);const idx=base+i;if(S.bindComp&&S.bindComp.key!==h)jumpTo(idx);return idx;}
  const n=parseInt(h,10);if(isNaN(n))return null;if(S.bindComp&&S.bindComp.key!==pad(n))jumpTo(n);return n;
}

/* ---------- the rail: every gesture also has a button ---------- */
function buildRail(){
  const r=D.getElementById('rail');r.innerHTML='';r.tabIndex=-1;
  const btn=(cls,ic,label,fn)=>{const b=el('button',cls,r);b.innerHTML=icon(ic);b.setAttribute('aria-label',label);b.addEventListener('click',e=>{e.stopPropagation();markInput();fn(b);});return b;};
  btn('hex prevb','prev','Previous',()=>go(-1));
  const ix=el('div','ix',r);ix.setAttribute('aria-hidden','true');OVR.ix=ix;
  btn('hex nextb','next','Next',()=>go(1));
  const sc=el('div','scr',r);sc.tabIndex=0;sc.setAttribute('role','slider');sc.setAttribute('aria-label','Scrub between compositions');sc.setAttribute('aria-valuemin','0');sc.setAttribute('aria-valuemax','100');
  sc.innerHTML='<span class="bd"></span>'+[0,25,50,75,100].map(v=>'<span class="tk" style="left:'+v+'%"></span>').join('')+'<span class="hd"></span>';OVR.scr=sc;
  let sd=null;const at=e=>{const b=sc.getBoundingClientRect();return OVR.vert?(e.clientY-b.top)/b.height:(e.clientX-b.left)/b.width;};
  sc.addEventListener('pointerdown',e=>{e.stopPropagation();if(count()<=1)return;sd=true;sc.setPointerCapture(e.pointerId);beginScrub();S.pos=S.goal=S.a+(clamp(at(e),0,1)*2-1)*.999;});
  sc.addEventListener('pointermove',e=>{if(sd){S.pos=S.goal=S.a+(clamp(at(e),0,1)*2-1)*.999;markInput();}});
  sc.addEventListener('pointerup',()=>{if(sd){sd=false;endScrub(null);}});
  sc.addEventListener('keydown',e=>{const st={ArrowRight:.1,ArrowUp:.1,ArrowLeft:-.1,ArrowDown:-.1}[e.key];if(st!=null&&count()>1){e.preventDefault();e.stopPropagation();markInput();S.auto=null;S.goal+=st;}});
  el('span','sep',r);
  btn('overb','over','Overview of every composition',()=>S.over.open?closeOverview():openOverview());
  btn('holdb','pause','Hold the rehearsal',()=>setHold(!S.hold)).setAttribute('aria-pressed','false');
  const sb=btn('soundb','mute','Sound',b=>{S.sound=!S.sound;if(S.sound)SOUND.init();b.innerHTML=icon(S.sound?'sound':'mute');b.setAttribute('aria-pressed',String(S.sound));if(S.sound)SOUND.play('toggle');});sb.setAttribute('aria-pressed','false');
  const tb=btn('themeb','theme','Light paper',b=>{setTheme(S.theme==='light'?'dark':'light');});tb.setAttribute('aria-pressed',String(S.theme==='light'));
  const tl=btn('tiltb','tilt','Tilt to shift the pieces',b=>{if(DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted'){enableTilt();b.setAttribute('aria-pressed','true');}}).catch(()=>{});else{S.tilt.on=!S.tilt.on;b.setAttribute('aria-pressed',String(S.tilt.on));}});
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')r.classList.add('has-tilt');
  buildFind(r);
  OVR.spines=el('div','',D.body);OVR.spines.id='spines';OVR.spines.style.cssText='position:fixed;left:0;top:0;width:0;height:0;z-index:25';
  layoutRail();updateRail();
}
function layoutRail(){
  const r=D.getElementById('rail'),M=S.M;if(!r||!M)return;
  const big=M.cls==='ultra';r.style.cssText='';OVR.vert=false;
  if(M.cls==='phone'){r.style.cssText='left:'+M.m+'px;right:'+M.m+'px;bottom:'+Math.max(10,M.m-4)+'px;flex-wrap:wrap;justify-content:space-between;row-gap:4px';
    OVR.ix.style.order='-2';OVR.scr.style.cssText='order:-1;flex:1 1 calc(100% - 110px);height:30px';OVR.scr.querySelector('.hd').style.top='-2px';OVR.scr.querySelector('.bd').style.top='10px';r.querySelector('.sep').style.display='none';OVR.ix.style.cssText='order:-2;min-width:0;height:30px;padding:0 10px;font-size:12px';r.style.gap='4px';}
  else if(M.cls==='phoneL'){r.style.cssText='right:'+Math.max(8,M.m-4)+'px;top:'+M.m+'px;bottom:'+M.m+'px;flex-direction:column;justify-content:space-between;width:52px';
    OVR.scr.style.cssText='display:none';r.querySelector('.sep').style.display='none';OVR.ix.style.minWidth='52px';OVR.ix.style.padding='0 4px';}
  else{const bot=M.m+(M.railB-M.m-44)/2;r.style.cssText='left:'+M.m+'px;bottom:'+Math.max(M.m*.6,(M.railB-44)/2)+'px';OVR.scr.style.cssText='';r.querySelector('.sep').style.display='';OVR.ix.style.minWidth='';
    if(big)r.style.transform='scale(1.25)',r.style.transformOrigin='0 100%';}
  layoutFind();layoutSpines();
}
function layoutSpines(){
  const host=OVR.spines;if(!host||!S.bindComp)return;host.innerHTML='';
  if(S.M.cls!=='phone'&&S.M.cls!=='phoneL')return;
  S.bindComp.slots.forEach((s,i)=>{if(!s.dock)return;const r=s.rect,b=el('button','',host);
    b.style.cssText='position:fixed;left:'+r.x+'px;top:'+(r.y-18)+'px;width:'+Math.max(r.w,30)+'px;height:44px;background:transparent';
    b.setAttribute('aria-label','Bring the '+(s.kind==='trace'?'trace':s.kind)+' into focus');
    b.addEventListener('click',e=>{e.stopPropagation();markInput();tick('toggle');S.phoneFocus={idx:S.a,k:s.sid};S.cache.delete(S.a);S.forceJump=true;jumpTo(S.a,S.reduced?.5:.8);});});
}
function updateRail(){
  if(!OVR.ix)return;const n=count();
  OVR.ix.innerHTML=n===Infinity?'<span>'+pad(mod(S.a,1000))+'</span><svg viewBox="-1 -1 20 10" aria-hidden="true"><path d="M9 4C6 0 1 0 1 4s5 4 8 0 8-4 8 0-5 4-8 0" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>':'<span>'+pad(mod(S.a,n)+1,2)+'/'+pad(n,2)+'</span>';
  const ob=D.querySelector('#rail .overb');if(ob)ob.setAttribute('aria-pressed',String(S.over.open));
  const one=n<=1;D.querySelectorAll('#rail .prevb,#rail .nextb').forEach(b=>{b.style.opacity=one?.4:'';});
}
function updateScrub(){
  if(!OVR.scr)return;const fr=S.jump?(S.jump.t/S.jump.dur):(S.pos-S.a);const v=clamp((fr+1)/2,0,1);
  const k=v.toFixed(3);if(OVR.sk===k)return;OVR.sk=k;OVR.scr.querySelector('.hd').style.left=(v*100)+'%';OVR.scr.setAttribute('aria-valuenow',Math.round(v*100));
}
function setTheme(t){S.theme=t;H.classList.toggle('light',t==='light');LS.set('theme',t);const b=D.querySelector('#rail .themeb');if(b)b.setAttribute('aria-pressed',String(t==='light'));
  const m=D.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#fafaf7':'#0b0d14';announce(t==='light'?'Paper':'Ink');}
function enableTilt(){S.tilt.on=true;addEventListener('deviceorientation',e=>{if(e.gamma==null)return;S.tilt.x=lerp(S.tilt.x,clamp(e.gamma/28,-1,1),.25);S.tilt.y=lerp(S.tilt.y,clamp((e.beta-40)/28,-1,1),.25);});}

/* ---------- sound: synthesised mechanical clicks, silent until asked ---------- */
const SOUND={ctx:null,last:{},
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();const b=this.ctx.createBuffer(1,this.ctx.sampleRate*.05,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);this.noise=b;}catch(e){}},
  play(kind){const c=this.ctx;if(!c)return;const t=c.currentTime,l=this.last[kind]||0;if(t-l<.025)return;this.last[kind]=t;if(c.state==='suspended')c.resume();
    const P={detent:[3400,9,.16,.03],toggle:[1900,6,.22,.05],slide:[5200,10,.05,.015],key:[2600,8,.08,.02],lift:[900,3,.16,.08],drop:[420,2,.28,.09],arrive:[260,1.5,.12,.12]}[kind]||[2000,5,.1,.03];
    const s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=P[0];f.Q.value=P[1];
    const g=c.createGain();g.gain.setValueAtTime(P[2],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[3]);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+P[3]+.01);
    if(kind==='toggle'||kind==='drop'||kind==='arrive'){const o=c.createOscillator(),og=c.createGain();o.frequency.setValueAtTime(kind==='toggle'?820:kind==='drop'?150:120,t);o.frequency.exponentialRampToValueAtTime(kind==='toggle'?500:60,t+.06);og.gain.setValueAtTime(kind==='toggle'?.05:.12,t);og.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(og).connect(c.destination);o.start(t);o.stop(t+.1);}
  }};

/* ---------- film grain: one generated tile, stepped at film rate ---------- */
function grain(){
  const g=D.getElementById('grain');const c=D.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),im=x.createImageData(180,180);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}
  x.putImageData(im,0,0);g.style.backgroundImage='url('+c.toDataURL()+')';
  if(!S.reduced){let k=0;setInterval(()=>{if(D.visibilityState!=='visible')return;k++;g.style.transform='translate('+((k*37)%180-90)+'px,'+((k*71)%180-90)+'px)';},90);}
}

/* ---------- start: the wordmark is there from the first frame; everything else unfolds out of it ---------- */
function init(){
  S.stage=D.getElementById('stage');
  H.classList.toggle('light',S.theme==='light');
  S.M=metrics(innerWidth,innerHeight,0);
  initMeasure();
  let a=0;const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h){if(S.mode==='cat'){const i=CREATIONS.findIndex(c=>c.id===h);if(i>=0)a=i;}else{const n=parseInt(h,10);if(!isNaN(n))a=n;}}
  S.a=a;S.pos=S.goal=a;
  const B=compAt(a);
  const wi=B.slots.findIndex(s=>s.kind==='wordmark');
  const seed=wi>=0?B.slots[wi]:B.slots[0];
  const A0={idx:a,key:B.key,slots:[seed],label:B.label};
  const p0=makePiece(seed);
  S.bindComp=A0;S.bind=[p0];
  const unseen=B.creation&&!S.seen[B.creation.id];
  S.jump={P:makePlan(A0,[p0],B,{spread:S.reduced?.15:unseen?.72:.5}),t:S.reduced?0:-.35,dur:S.reduced?.6:unseen?2.6:2.0};
  buildRail();bindInput();grain();
  let rq=0;
  addEventListener('resize',()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;const W=innerWidth,Hh=innerHeight;if(S.M.W===W&&S.M.H===Hh)return;
    const was=S.M.cls;OV.key=null;if(S.over.open)closeOverview(true);if(S.lift)drop(true);recompose();if(S.M.cls!==was)announce('Re-composed');});});
  (RM.addEventListener?RM.addEventListener.bind(RM):RM.addListener.bind(RM))('change',e=>{S.reduced=e.matches;});
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=='function'&&S.M.touchy)enableTilt();
  if(D.fonts&&D.fonts.ready)D.fonts.ready.then(()=>{initMeasure();for(const p of S.pieces)p.lw=-1;});
  D.addEventListener('visibilitychange',()=>{last=now();});
  requestAnimationFrame(frame);
  window.__gcs=S; // read-only handle for inspection
}
init();
})();
